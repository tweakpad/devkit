<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>devkit stress</title>
    <style>
      html,
      body {
        margin: 0;
        block-size: 100%;
        background: var(--tp-background);
        color: var(--tp-foreground);
        font: 13px/1.4 var(--tp-font-sans);
      }

      main {
        padding: 16px;
        max-inline-size: 40rem;
      }

      button {
        font: inherit;
      }
    </style>

  <body>
    <main>
      <h1>Stress: 1000 bindings, 30 changing per frame</h1>
      <p>
        <button id="expand">Expand all folders</button>
        <button id="collapse">Collapse all folders</button>
        <button id="mutate">Toggle app mutation</button>
        <a href="/">Playground</a>
      </p>
      <p id="report"></p>
    </main>
    <script type="module" src="./stress.ts"></script>
