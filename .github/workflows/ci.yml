name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Type-checks src with tests, demos and the configs, which the build leaves out.
      - run: npm run typecheck
      # Builds, packs and installs the tarball into a consumer project (files, exports, types).
      - run: npm run test:package
      # Builds the Storybook of showcases and documentation pages, so a broken story fails here.
      - run: npm run build-storybook
